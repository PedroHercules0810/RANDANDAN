version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - nvm use 24
        - node --version
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/RANDANDAN/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
