<nav class="navbar">
    <div class="container nav-container">
        <a routerLink="/" class="nav-logo">
            <svg class="logo-mark" viewBox="0 0 72 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="13" cy="33" r="9" />
                <path d="M13 33 L31 20" />
                <path d="M31 20 L46 18" />
                <path d="M46 18 L60 10" />
                <path d="M46 18 L42 10" />
                <path d="M42 10 L36 9" />
                <circle cx="24" cy="6" r="4" />
                <path d="M25 12 L31 20" />
                <path d="M26 13 L36 9" />
                <path d="M31 20 L28 28 L23 31" />
                <circle class="logo-wheel" cx="60" cy="10" r="9" />
            </svg>
            <span>RANDANDAN</span>
        </a>
        <div class="nav-links" [class.active]="menuOpen()">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link" (click)="closeMenu()">Início</a>
            <a routerLink="/funcionalidades" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Funcionalidades</a>
            <a routerLink="/como-jogar" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Como Jogar</a>
            @if (authState().status === 'authenticated') {
                <a routerLink="/perfil" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Meu Perfil</a>
            } @else {
                <a routerLink="/login" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Entrar</a>
            }
        </div>
        <button class="nav-toggle" aria-label="Abrir menu" (click)="toggleMenu()">
            <span [class.active]="menuOpen()"></span>
            <span [class.active]="menuOpen()"></span>
            <span [class.active]="menuOpen()"></span>
        </button>
    </div>
</nav>
