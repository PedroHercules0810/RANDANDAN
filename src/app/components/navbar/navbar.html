<nav class="navbar">
    <div class="container nav-container">
        <a routerLink="/" class="nav-logo">
            <img src="logo.svg" alt="RANDANDAN" class="logo-image" />
            <span class="nav-brand-text">RANDANDAN</span>
        </a>
        <div class="nav-links" [class.active]="menuOpen()">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link" (click)="closeMenu()">Jogar</a>
            <a routerLink="/como-jogar" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Como Jogar</a>
            <a routerLink="/funcionalidades" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Funcionalidades</a>
            @if (authState().status === 'authenticated' && authState().user; as user) {
                <a routerLink="/equipe" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Equipes</a>
                <a routerLink="/perfil" routerLinkActive="active" class="nav-link nav-profile-pill" (click)="closeMenu()">
                    @if (profileImage(); as avatarUrl) {
                        <img [src]="avatarUrl" alt="" class="nav-avatar-img" />
                    } @else {
                        <span class="nav-avatar-fallback">{{ user.displayName.slice(0, 1).toUpperCase() }}</span>
                    }
                    <span>{{ user.displayName }}</span>
                </a>
            } @else {
                <a routerLink="/login" routerLinkActive="active" class="nav-link nav-login-pill" (click)="closeMenu()">Entrar</a>
            }
        </div>
        <button class="nav-toggle" aria-label="Abrir menu" (click)="toggleMenu()">
            <span [class.active]="menuOpen()"></span>
            <span [class.active]="menuOpen()"></span>
            <span [class.active]="menuOpen()"></span>
        </button>
    </div>
</nav>
